<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="English">
  <!-- The union flag marks English, the language, not the United Kingdom, the
       country. That is a convention rather than a fact - a flag names a state
       and a state is not a language - and it is the convention a Vietnamese
       reader expects next to a Vietnamese flag. Swapping it for the US flag is
       a one-file change.

       Drawn at the official 2:1 and cropped to the circle, not squashed into
       one: scale 32/30 takes the 60x30 construction to 64x32, and the
       translate re-centres it, so the diagonals keep their real angles and the
       circle cuts the ends off. Literal hex for the same reason as vn.svg. -->
  <clipPath id="round"><circle cx="16" cy="16" r="16"/></clipPath>
  <g clip-path="url(#round)">
    <g transform="translate(-16 0) scale(1.06667)">
      <clipPath id="counterchange"><path d="M30 15h30v15zv15h-30zh-30v-15zv-15h30z"/></clipPath>
      <path d="M0 0v30h60V0z" fill="#012169"/>
      <path d="M0 0 60 30M60 0 0 30" stroke="#fff" stroke-width="6"/>
      <path d="M0 0 60 30M60 0 0 30" clip-path="url(#counterchange)" stroke="#c8102e" stroke-width="4"/>
      <path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10"/>
      <path d="M30 0v30M0 15h60" stroke="#c8102e" stroke-width="6"/>
    </g>
  </g>
</svg>
